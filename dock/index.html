<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kannada Bible Dock</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">

    <h2>📖 Kannada Bible Dock</h2>

    <div class="search-shell">
      <div id="searchMirror" class="search-mirror" aria-hidden="true"></div>
      <input
        id="searchInput"
        type="text"
        placeholder="Book (gray shows completion) or Book 5 — Enter"
        autocomplete="off"
        spellcheck="false"
      />
    </div>

    <div class="font-size-row">
      <label for="fontSize">Font size</label>
      <input type="range" id="fontSize" min="20" max="120" value="60">
      <span id="fontSizeVal" class="style-value">60</span>
    </div>

    <div class="text-style-panel" id="textStylePanel">
      <button
        type="button"
        class="text-style-toggle"
        id="textStyleToggle"
        aria-expanded="false"
        aria-controls="textStyleBody"
      >
        <span class="text-style-toggle-label">Text appearance</span>
        <span class="toggle-chevron" aria-hidden="true">▾</span>
      </button>

      <div class="text-style-body" id="textStyleBody" hidden>
        <div class="style-row style-row-inline">
          <label for="textColor">Text color</label>
          <input type="color" id="textColor" value="#ffffff">
        </div>

        <div class="style-row style-toggles">
          <label class="toggle-label">
            <input type="checkbox" id="textBold" checked>
            Bold
          </label>
          <label class="toggle-label">
            <input type="checkbox" id="textItalic">
            Italic
          </label>
        </div>

        <div class="style-row style-row-shadow">
          <label for="shadowColor">Outline</label>
          <input type="color" id="shadowColor" value="#000000" title="Outline color">
          <label for="shadowIntensity" class="sub-label">Width</label>
          <input type="range" id="shadowIntensity" min="0" max="100" value="70">
          <span id="shadowIntensityVal" class="style-value">70</span>
        </div>

        <div class="style-row style-row-border">
          <label class="toggle-label">
            <input type="checkbox" id="dropShadowEnabled">
            Drop shadow
          </label>
          <input type="color" id="dropShadowColor" value="#000000" title="Shadow color">
          <label for="dropShadowIntensity" class="sub-label">Depth</label>
          <input type="range" id="dropShadowIntensity" min="0" max="100" value="50">
          <span id="dropShadowIntensityVal" class="style-value">50</span>
        </div>

        <div class="style-row style-row-border">
          <label class="toggle-label">
            <input type="checkbox" id="borderEnabled">
            Border
          </label>
          <input type="color" id="borderColor" value="#000000" title="Border color">
          <label for="borderWidth" class="sub-label">Width</label>
          <input type="range" id="borderWidth" min="1" max="12" value="2">
          <span id="borderWidthVal" class="style-value">2</span>
        </div>

        <button type="button" class="style-reset-btn" id="resetStyleDefaults">
          Reset to default colors
        </button>
      </div>
    </div>

    <p class="shortcut-hint">In this box: ⌘/Ctrl+A select all, C copy, V paste, X cut, Z undo (⇧⌘Z redo on Mac). Tab accepts gray hint · Enter opens chapters or verses · ⌘/Ctrl+A elsewhere copies the verse list</p>

    <div id="verseList"></div>

    <div id="dockToast" role="status" aria-live="polite"></div>
  </div>

  <script src="dock.js"></script>
</body>
</html>
