<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kannada Bible Output</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: "Noto Sans Kannada", sans-serif;
      overflow: visible;
    }

    #verseBox {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      padding: 24px 50px 80px;
      box-sizing: border-box;
      text-align: center;
      overflow: visible;
    }

    #verseBody {
      display: inline-block;
      max-width: 95%;
      text-align: center;
      line-height: 1.45;
      overflow: visible;
    }

    .verse-block {
      position: relative;
      display: block;
    }

    .verse-block-ref {
      margin-top: 0.5em;
    }

    .verse-text,
    .verse-reference {
      position: relative;
      z-index: 1;
      display: block;
    }

    .verse-ghost {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.18;
    }
  </style>
</head>

<body>
  <div id="verseBox">
    <div id="verseBody">Loading...</div>
  </div>

  <script>
    let lastStateKey = "";

    function buildReference(data) {
      let ref = (data.reference || "").trim();
      if (ref) return ref;
      const { book, chapter, verseNum } = data;
      if (book && chapter !== "" && chapter != null && verseNum !== "" && verseNum != null) {
        return `${book} ${chapter}:${verseNum}`;
      }
      return "";
    }

    function isTruthyFlag(v) {
      return v === true || v === "true" || v === 1 || v === "1";
    }

    function hexToRgb(hex) {
      const raw = String(hex || "").replace("#", "");
      if (!/^[0-9a-f]{6}$/i.test(raw)) return null;
      return {
        r: parseInt(raw.slice(0, 2), 16),
        g: parseInt(raw.slice(2, 4), 16),
        b: parseInt(raw.slice(4, 6), 16),
      };
    }

    function buildDropShadowFilter(color, intensity, enabled, fontSize) {
      if (!isTruthyFlag(enabled)) return "none";
      const amount = Math.max(0, Math.min(100, parseInt(intensity, 10) || 0));
      if (amount === 0) return "none";

      const rgb = hexToRgb(color) || { r: 0, g: 0, b: 0 };
      const size = Math.max(12, parseInt(fontSize, 10) || 60);
      const scale = size / 60;
      const x = Math.max(2, Math.round((2 + (amount / 100) * 12) * scale));
      const y = Math.max(2, Math.round((2 + (amount / 100) * 12) * scale));
      const blur = Math.round((4 + (amount / 100) * 18) * scale);
      const alpha = 0.55 + (amount / 100) * 0.45;
      return `drop-shadow(${x}px ${y}px ${blur}px rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${alpha}))`;
    }

    function applyOutline(el, color, intensity) {
      const amount = Math.max(0, Math.min(100, parseInt(intensity, 10) || 0));
      if (amount === 0) {
        el.style.webkitTextStroke = "";
        el.style.paintOrder = "";
        return;
      }
      const width = Math.max(1, Math.round(1 + (amount / 100) * 5));
      el.style.webkitTextStroke = `${width}px ${color || "#000000"}`;
      el.style.paintOrder = "stroke fill";
    }

    function applyTextAppearance(el, style, fontSize) {
      const size = Math.max(12, parseInt(fontSize, 10) || 60);
      const textColor = style.textColor || "#ffffff";
      const outlineColor = style.shadowColor || "#000000";
      const outlineWidth = style.shadowIntensity != null ? style.shadowIntensity : "70";
      const borderWidth = Math.max(1, parseInt(style.borderWidth, 10) || 2);
      const dropFilter = buildDropShadowFilter(
        style.dropShadowColor || "#000000",
        style.dropShadowIntensity != null ? style.dropShadowIntensity : "50",
        style.dropShadowEnabled,
        size
      );

      el.style.fontSize = size + "px";
      el.style.color = textColor;
      el.style.fontWeight = style.bold !== false ? "700" : "400";
      el.style.fontStyle = style.italic ? "italic" : "normal";
      el.style.textShadow = "none";
      applyOutline(el, outlineColor, outlineWidth);
      el.style.filter = dropFilter;
      el.style.webkitFilter = dropFilter;

      if (style.borderEnabled) {
        el.style.border = `${borderWidth}px solid ${style.borderColor || "#000000"}`;
        el.style.padding = "10px 18px";
        el.style.borderRadius = "6px";
        el.style.display = "inline-block";
      } else {
        el.style.border = "none";
        el.style.padding = "0";
        el.style.borderRadius = "0";
      }
    }

    function createTextBlock(text, style, fontSize, kind) {
      const block = document.createElement("span");
      block.className = "verse-block verse-block-" + kind;

      if (isTruthyFlag(style.dropShadowEnabled)) {
        const size = Math.max(12, parseInt(fontSize, 10) || 60);
        const amount = Math.max(0, Math.min(100, parseInt(style.dropShadowIntensity, 10) || 0));
        const offset = Math.round(size * (0.04 + (amount / 100) * 0.08));
        const ghost = document.createElement("span");
        ghost.className = "verse-ghost";
        ghost.setAttribute("aria-hidden", "true");
        ghost.textContent = text;
        ghost.style.fontSize = size + "px";
        ghost.style.fontWeight = style.bold !== false ? "700" : "400";
        ghost.style.fontStyle = style.italic ? "italic" : "normal";
        ghost.style.color = style.dropShadowColor || "#000000";
        ghost.style.transform = `translate(${offset}px, ${offset}px)`;
        block.appendChild(ghost);
      }

      const main = document.createElement("span");
      main.className = kind === "ref" ? "verse-reference" : "verse-text";
      main.textContent = text;
      applyTextAppearance(main, style, fontSize);
      block.appendChild(main);
      return block;
    }

    function renderOverlay(verse, reference, style) {
      const bodyEl = document.getElementById("verseBody");
      const fontSize = style.fontSize || "60";

      bodyEl.replaceChildren();
      bodyEl.appendChild(createTextBlock(verse || "Select a verse in the dock", style, fontSize, "verse"));

      if (verse && reference) {
        const refSize = Math.max(10, (parseInt(fontSize, 10) || 60) - 3);
        bodyEl.appendChild(createTextBlock(reference, style, refSize, "ref"));
      }
    }

    function stateKey(data) {
      return JSON.stringify({
        verse: data.verse || "",
        reference: buildReference(data),
        fontSize: data.fontSize || "60",
        textColor: data.textColor || "#ffffff",
        bold: data.bold !== false,
        italic: Boolean(data.italic),
        shadowColor: data.shadowColor || "#000000",
        shadowIntensity: data.shadowIntensity != null ? String(data.shadowIntensity) : "70",
        dropShadowEnabled: isTruthyFlag(data.dropShadowEnabled),
        dropShadowColor: data.dropShadowColor || "#000000",
        dropShadowIntensity: data.dropShadowIntensity != null ? String(data.dropShadowIntensity) : "50",
        borderEnabled: Boolean(data.borderEnabled),
        borderColor: data.borderColor || "#000000",
        borderWidth: data.borderWidth != null ? String(data.borderWidth) : "2",
      });
    }

    async function updateVerse() {
      try {
        const res = await fetch("/api/state?_=" + Date.now(), { cache: "no-store" });
        const data = await res.json();
        const key = stateKey(data);
        if (key === lastStateKey) return;
        lastStateKey = key;
        renderOverlay(data.verse || "", buildReference(data), data);
      } catch (e) {
        document.getElementById("verseBody").textContent = "Connecting...";
        lastStateKey = "";
      }
    }

    // ponytail: self-check — upgrade path: ?selfcheck=1 in browser URL
    if (new URLSearchParams(location.search).get("selfcheck") === "1") {
      console.assert(
        buildDropShadowFilter("#ff0000", "50", true, "60") !== "none",
        "drop shadow filter"
      );
    }

    updateVerse();
    setInterval(updateVerse, 150);
  </script>
</body>
</html>
